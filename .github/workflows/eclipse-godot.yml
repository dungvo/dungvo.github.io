name: Eclipse Godot headless validation
on:
  pull_request:
    paths:
      - 'apps/games/light-quest/eclipse/**'
      - '.github/workflows/eclipse-godot.yml'
  push:
    paths:
      - 'apps/games/light-quest/eclipse/**'
      - '.github/workflows/eclipse-godot.yml'
jobs:
  parse-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
      - name: Import and validate Godot project
        run: |
          set -o pipefail
          godot --headless --editor --path apps/games/light-quest/eclipse --import --quit 2>&1 | tee import.log
          ! grep -Eq 'SCRIPT ERROR|Parse Error|ERROR: Failed to load script' import.log
      - name: Smoke test scene
        run: |
          set -o pipefail
          timeout 25s godot --headless --path apps/games/light-quest/eclipse --quit-after 15 2>&1 | tee scene.log
          ! grep -Eq 'SCRIPT ERROR|Parse Error|ERROR: Failed to load script|Invalid access' scene.log
      - name: Test gameplay mechanics
        run: timeout 35s godot --headless --path apps/games/light-quest/eclipse --script res://tests/smoke.gd

  asset-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download licensed Kenney prototype sprite
        run: python3 apps/games/light-quest/eclipse/tools/install_cc0_assets.py
      - name: Inspect possible animated CC0 hero sheets
        run: |
          python3 - <<'PY'
          import json,urllib.request
          url='https://api.github.com/repos/Tiddybub/2d-assets/contents/characters/oga-game-character'
          req=urllib.request.Request(url,headers={'User-Agent':'LightQuestAssetAudit','Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=20) as res: data=json.load(res)
          for x in data:print('CC0_CANDIDATE',x['name'],x['size'],x.get('download_url'))
          PY
      - name: Inspect SpriteCanvas legal CC0 animated art links
        run: |
          python3 - <<'PY'
          import urllib.request,re,html
          url='https://spritecanvas.com/free-sprite-sheets/'
          request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(request,timeout=25) as response:page=response.read().decode('utf8','replace')
          for match in re.finditer(r'href=["\\']([^"\\']+)',page):
              link=html.unescape(match.group(1))
              if '.zip' in link.lower() or ('download' in link.lower() and 'moss' in link.lower()):
                  print('ART_URL',link[:350])
          PY
      - name: Upload source sprite, license and provenance
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-kenney-cc0-prototype
          path: apps/games/light-quest/eclipse/assets/kenney/
          if-no-files-found: error

  web-preview:
    runs-on: ubuntu-latest
    needs: [parse-project, asset-pack]
    steps:
      - uses: actions/checkout@v4
      - name: Install Kenney CC0 prototype asset
        run: python3 apps/games/light-quest/eclipse/tools/install_cc0_assets.py
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Import content and export web build
        run: |
          set -euo pipefail
          cd apps/games/light-quest/eclipse
          mkdir -p build/web
          godot --headless --editor --import --quit
          godot --headless --export-release Web build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.wasm
      - name: Upload HTML5 preview
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-web-preview
          path: apps/games/light-quest/eclipse/build/web/
          if-no-files-found: error

  publish-eclipse-demo:
    name: Publish isolated Eclipse web demo
    # Only PR #76 from this repository and our named feature branch can publish.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/light-quest-eclipse-playable-slice'
    needs: [web-preview]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: eclipse-public-preview
      cancel-in-progress: false
    steps:
      - name: Checkout site main (not feature source)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Copy pre-tested HTML5 artifact into isolated public folder
        uses: actions/download-artifact@v4
        with:
          name: eclipse-web-preview
          path: apps/games/light-quest/eclipse/
      - name: Check build files
        run: |
          test -s apps/games/light-quest/eclipse/index.html
          test -s apps/games/light-quest/eclipse/index.wasm
          test -s apps/games/light-quest/eclipse/index.pck
      - name: Commit demo only; preserve all other games
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/games/light-quest/eclipse/
          if git diff --cached --quiet; then
            echo "No changes to public Eclipse demo"
            exit 0
          fi
          git commit -m "deploy(eclipse): publish isolated Godot HTML5 gameplay preview"
          git pull --rebase origin main
          git push origin HEAD:main

name: Eclipse Godot headless validation
on:
  pull_request:
    paths:
      - 'apps/games/light-quest/eclipse/**'
      - '.github/workflows/eclipse-godot.yml'
  push:
    paths:
      - 'apps/games/light-quest/eclipse/**'
      - '.github/workflows/eclipse-godot.yml'
jobs:
  parse-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
      - name: Import and validate Godot project
        run: |
          set -o pipefail
          godot --headless --editor --path apps/games/light-quest/eclipse --import --quit 2>&1 | tee import.log
          ! grep -Eq 'SCRIPT ERROR|Parse Error|ERROR: Failed to load script' import.log
      - name: Smoke test scene
        run: |
          set -o pipefail
          timeout 25s godot --headless --path apps/games/light-quest/eclipse --quit-after 15 2>&1 | tee scene.log
          ! grep -Eq 'SCRIPT ERROR|Parse Error|ERROR: Failed to load script|Invalid access' scene.log
      - name: Test gameplay mechanics
        run: timeout 35s godot --headless --path apps/games/light-quest/eclipse --script res://tests/smoke.gd

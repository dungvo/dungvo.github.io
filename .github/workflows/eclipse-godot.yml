name: Eclipse Godot 4.4.1 chapter validation and Pages export
on:
  pull_request:
    paths:
      - 'apps/games/light-quest/eclipse/**'
      - '.github/workflows/eclipse-godot.yml'
  push:
    branches: [feature/eclipse-godot-room-select-v1]
    paths:
      - 'apps/games/light-quest/eclipse/**'
      - '.github/workflows/eclipse-godot.yml'
permissions:
  contents: read
concurrency:
  group: eclipse-chapters-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Import and check scripts
        working-directory: apps/games/light-quest/eclipse
        shell: bash
        run: |
          set -euo pipefail
          godot --version | grep '^4.4.1.stable'
          godot --headless --editor --import --quit 2>&1 | tee import.log
          ! grep -Eq 'SCRIPT ERROR|Parse Error|ERROR: Failed to load' import.log
      - name: Real Godot mechanics and six complete playthroughs
        working-directory: apps/games/light-quest/eclipse
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --fixed-fps 60 --script res://tests/smoke.gd 2>&1 | tee smoke.log
          grep -q 'ECLIPSE SMOKE PASS' smoke.log
          timeout 20s godot --headless --script res://tests/hit_geometry_test.gd 2>&1 | tee geometry.log
          grep -q 'HIT GEOMETRY PASS' geometry.log
          timeout 120s godot --headless --fixed-fps 60 --script res://tests/campaign_playthrough.gd 2>&1 | tee campaign.log
          grep -q 'ECLIPSE SIX RUNS PASS' campaign.log
          timeout 45s godot --headless --fixed-fps 60 --script res://tests/abilities_test.gd 2>&1 | tee abilities.log
          grep -q 'ECLIPSE ABILITIES PASS' abilities.log
          timeout 120s godot --headless --fixed-fps 60 --script res://tests/routes_playthrough.gd 2>&1 | tee routes.log
          grep -q 'ECLIPSE ROUTES PASS' routes.log
          timeout 45s godot --headless --fixed-fps 60 --script res://tests/sky_arts_test.gd 2>&1 | tee sky-arts.log
          grep -q 'ECLIPSE SKY ARTS PASS' sky-arts.log
          timeout 160s godot --headless --fixed-fps 60 --script res://tests/sky_playthrough.gd 2>&1 | tee sky-campaign.log
          grep -q 'ECLIPSE SKY PASS' sky-campaign.log
          timeout 25s godot --headless --fixed-fps 60 --script res://tests/art_vfx_test.gd 2>&1 | tee art-vfx.log
          grep -q 'ECLIPSE VFX PASS' art-vfx.log
          timeout 30s godot --headless --fixed-fps 60 --script res://tests/journey_test.gd 2>&1 | tee journey.log
          grep -q 'ECLIPSE JOURNEY PASS' journey.log
          timeout 35s godot --headless --fixed-fps 60 --script res://tests/horizon_playthrough.gd 2>&1 | tee horizon.log
          grep -q "V6 CONTINUOUS ROUTE PASS" horizon.log
          timeout 35s godot --headless --fixed-fps 60 --script res://tests/time_lighthouse_test.gd 2>&1 | tee timeline.log
          grep -q "ECLIPSE TIMELINE PASS" timeline.log
          ! grep -Eq 'SCRIPT ERROR|Parse Error|ERROR:' timeline.log horizon.log journey.log smoke.log geometry.log campaign.log abilities.log routes.log sky-arts.log sky-campaign.log art-vfx.log
      - name: Export single-threaded Godot Web
        working-directory: apps/games/light-quest/eclipse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --export-release Web build/web/index.html 2>&1 | tee export.log
          ! grep -Eq 'SCRIPT ERROR|Parse Error|ERROR:' export.log
          test -s build/web/index.wasm
          test -s build/web/index.pck
          python3 tools/stamp_web.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser QA on desktop and touch 3x DPR
        working-directory: apps/games/light-quest/eclipse
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "${RUNNER_TEMP}/eclipse-browser" --no-audit --no-fund playwright@1.56.1
          ECLIPSE_CHROME="$(command -v google-chrome)" NODE_PATH="${RUNNER_TEMP}/eclipse-browser/node_modules" node tests/browser_smoke.cjs 2>&1 | tee browser.log
          grep -q 'ECLIPSE WEB PASS' browser.log
      - name: Native renderer battle captures
        working-directory: apps/games/light-quest/eclipse
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s xvfb-run -a godot --audio-driver Dummy --script res://tests/capture_visual.gd 2>&1 | tee renderer.log
          timeout 120s xvfb-run -a godot --audio-driver Dummy --fixed-fps 60 --script res://tests/capture_arts.gd 2>&1 | tee art-renderer.log
          grep -q 'ECLIPSE VFX CAPTURE PASS' art-renderer.log
          ! grep -Eq 'SCRIPT ERROR|Parse Error|ERROR:' renderer.log art-renderer.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eclipse-chapter-qa
          path: |
            apps/games/light-quest/eclipse/*.log
            apps/games/light-quest/eclipse/visual-qa/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: eclipse-web-preview
          path: apps/games/light-quest/eclipse/build/web/
          if-no-files-found: error
  publish-eclipse-demo:
    # The user authorized deployment of these chapters. Every validation above must pass.
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/eclipse-godot-room-select-v1'
    needs: [validate-and-export]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: eclipse-public-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: eclipse-web-preview
          path: apps/games/light-quest/eclipse/godot-play/
      - name: Commit only the validated Eclipse export
        shell: bash
        run: |
          set -euo pipefail
          dest=apps/games/light-quest/eclipse/godot-play
          test -s "$dest/index.html"
          test -s "$dest/index.wasm"
          pack=$(python3 -c 'import json; print(json.load(open("apps/games/light-quest/eclipse/godot-play/build-info.json"))["main_pack"])')
          test -s "$dest/$pack"
          touch "$dest/.nojekyll"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dest"
          if git diff --cached --quiet; then exit 0; fi
          test -z "$(git diff --cached --name-only | grep -v '^apps/games/light-quest/eclipse/godot-play/' || true)"
          git commit -m "deploy(eclipse): validated three-chapter Godot build ${{ github.sha }}"
          git pull --rebase origin main
          git push origin HEAD:main

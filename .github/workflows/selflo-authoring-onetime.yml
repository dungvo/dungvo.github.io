name: Selflo Authoring publisher (one-time)
on:
  push:
    branches:
      - content/selflo-tang-khong-ton-tai-10-fulltext-20261101
    paths:
      - .github/workflows/selflo-authoring-onetime.yml
      - apps/selflo/perspective-library/source/vi/quotes/attention/027.vi.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  authoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish Authoring with canonical source and strict validators
        working-directory: apps/selflo
        run: ./scripts/publish-perspective-library --channel authoring
      - name: Verify ten chapters and ownership quotes; preserve Release
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("apps/selflo")
          m=json.loads((root/"perspective-library/authoring/vi/manifest.json").read_text())
          items=[x for x in m["files"] if x.get("kind")=="story"]
          series=[x for x in items if x.get("id","").startswith("story.tang_khong_ton_tai_chuong_")]
          assert len(series)==10, (len(series),[x["id"] for x in series])
          expected={f"story.tang_khong_ton_tai_chuong_{i:02d}" for i in range(1,11)}
          assert {x["id"] for x in series}==expected
          for item in series:
            obj=json.loads((root/"perspective-library/authoring/vi"/item["path"]).read_text())
            assert obj["review"]["status"]=="needs_owner_review"
            assert obj["rights"]["status"]=="unverified"
            assert obj["status"]=="draft"
            assert obj["reader_format"]=="editorial_v3"
          print("Selflo Authoring verified: 10 complete V3 drafts",m["library_revision"])
          PY
      - name: Commit generated Authoring to this PR branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/selflo/perspective-library/authoring/vi
          if ! git diff --cached --quiet; then
            git commit -m "build(selflo): generate Authoring with 10 Tầng không tồn tại chapters"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

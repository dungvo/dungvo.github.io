<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Food Assistant · API Playground</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f7f2;color:#24352d;font:16px system-ui,sans-serif}main{max-width:780px;margin:auto;padding:24px 16px}a{color:#25634a}h1{font-size:28px;margin:20px 0 8px}p{line-height:1.5;color:#52635a}section{background:white;border:1px solid #ddd;border-radius:16px;padding:20px;margin:16px 0}label{display:block;font-weight:600;margin:12px 0 6px}input,textarea,select{width:100%;font:inherit;border:1px solid #b7c3ba;border-radius:9px;padding:12px;background:white}textarea{min-height:100px}button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;background:#25634a;color:white;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:#e6eee8;color:#254c39}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f4f1;padding:14px;border-radius:10px;font-size:13px}#summary{white-space:pre-wrap;line-height:1.7;font-weight:600}small{color:#52635a}</style></head><body><main><a href="../">← Food Assistant</a><h1>AI Playground</h1><p>Thử API phân tích gọi món. Không lưu đơn và không gửi xuống bếp. Token chỉ giữ trong ô nhập của trang này.</p><section><form id="form"><label for="endpoint">URL Cloudflare Worker</label><input id="endpoint" type="url" placeholder="https://food-assistant-api.example.workers.dev" required><label for="token">Test token</label><input id="token" type="password" autocomplete="off" required><label for="sample">Câu mẫu</label><select id="sample"><option value="">Chọn câu mẫu</option></select><label for="input">Câu gọi món</label><textarea id="input" maxlength="500" required>Bằng 8 3 tô</textarea><div class="buttons"><button id="send" type="submit">Phân tích câu gọi món</button><button id="status" type="button" class="secondary">Kiểm tra kết nối</button></div></form></section><section aria-live="polite"><h2>Kết quả</h2><p id="meta">Chưa gửi yêu cầu.</p><div id="summary"></div><details open><summary>JSON gốc</summary><pre id="raw">—</pre></details></section></main><script type="module">
const $=id=>document.getElementById(id);
for(const s of ['Bằng 8 3 tô','Số 8 3 tô bò kho','Thêm ổ bánh mì bào 2','Bàn 5 hai tô gào không hành','Bàn 3 hai phỏ bồ kho giá trụng rau trụng','Bàn 6 một tô tái một chén tái hột gà','Bàn 4 một hủ tiếu bò kho thêm nước lèo','Bàn 9 hai phở nạm ko tiêu']) $('sample').add(new Option(s,s));
$('sample').onchange=()=>{if($('sample').value)$('input').value=$('sample').value};
async function run(status=false){
 $('summary').textContent='';$('raw').textContent='—';
 let url;try{url=new URL($('endpoint').value);if(url.protocol!=='https:'||url.username||url.password||url.search||url.hash)throw Error();url.pathname=status?'/status':'/parse'}catch{$('meta').textContent='Nhập URL HTTPS của Worker hợp lệ.';return}
 const token=$('token').value.trim();if(!token){$('meta').textContent='Nhập TEST_TOKEN.';return}
 $('send').disabled=$('status').disabled=true;$('meta').textContent='Đang gửi...';const start=performance.now();
 const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),30000);
 try{const response=await fetch(url,{method:status?'GET':'POST',headers:{Authorization:'Bearer '+token,...(status?{}:{'Content-Type':'application/json'})},...(status?{}:{body:JSON.stringify({text:$('input').value.trim()})}),signal:controller.signal,redirect:'error',cache:'no-store'});
 const raw=await response.text();let data;try{data=JSON.parse(raw)}catch{data=null}
 $('meta').textContent='HTTP '+response.status+' · '+Math.round(performance.now()-start)+' ms'+(data?.engine?' · '+data.engine:'')+(data?.dictionary_version?' · Dict '+data.dictionary_version:'');
 $('raw').textContent=data?JSON.stringify(data,null,2):raw;
 if(data?.result?.items&&Array.isArray(data.result.items)) $('summary').textContent='Bàn '+data.result.table_id+'\n'+data.result.items.map(i=>i.quantity+' × '+(i.item_name||i.item_id)+(i.modifiers?.length?' — '+i.modifiers.join(', '):'')).join('\n')+(data.needs_review?'\nCần kiểm tra trước khi lưu.':'');
 else $('summary').textContent=data?.error|| (status&&response.ok?'Kết nối thành công.':'');
 }catch(e){$('meta').textContent=e.name==='AbortError'?'Hết thời gian chờ.':'Không kết nối được. Kiểm tra URL, mạng và CORS trên Worker.'}finally{clearTimeout(timer);$('send').disabled=$('status').disabled=false}
}
$('form').onsubmit=e=>{e.preventDefault();run()};$('status').onclick=()=>run(true);
</script></body></html>

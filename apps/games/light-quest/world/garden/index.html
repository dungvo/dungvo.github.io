<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081719">
  <title>Khu Vườn Bị Lãng Quên · Light Quest</title>
  <link rel="stylesheet" href="../expedition.css">
  <script type="module" src="../expedition.js"></script>
</head>
<body data-campaign="garden">
  <main class="shell">
    <header class="masthead">
      <a class="brand" href="../../" aria-label="Ánh Sáng, về bản gốc"><span aria-hidden="true">✦</span><span>Ánh Sáng<small>LIGHT QUEST</small></span></a>
      <nav aria-label="Hành trình">
        <a href="../" class="nav-link">Thung lũng <span aria-hidden="true">↗</span></a>
        <button id="journal" type="button">Hành trình</button>
        <button id="pause" type="button">Tạm dừng</button>
      </nav>
    </header>
    <section class="heading" aria-labelledby="title">
      <div><p id="chapter" class="eyebrow"></p><h1 id="title">Khu Vườn Bị Lãng Quên</h1></div>
      <div id="progress" class="progress"></div>
    </section>
    <section id="scene" class="scene" aria-label="Khung cảnh và bàn giải đố">
      <picture class="backdrop">
        <source media="(max-width: 620px)" srcset="../moonwood-small.webp">
        <img src="../moonwood.webp" width="1440" height="960" alt="" fetchpriority="high">
      </picture>
      <div class="atmosphere" aria-hidden="true">
        <i class="mist"></i><i class="tree-light"></i><i class="water-light"></i><i class="portal"></i>
        <i class="firefly"></i><i class="firefly"></i><i class="firefly"></i><i class="firefly"></i><i class="firefly"></i>
        <svg class="blooms" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
      </div>
      <div class="scene-stamp"><span aria-hidden="true">✧</span><span id="objectives"></span></div>
      <div id="board" class="board" aria-label="Các cổ vật có thể tương tác"></div>
      <div id="explore" class="explore" hidden></div>
    </section>
    <section class="action-bar" aria-label="Điều khiển">
      <div class="brief">
        <span class="eyebrow" id="status"></span>
        <p id="feedback" role="status"></p>
      </div>
      <div class="actions">
        <button id="undo" type="button"><span aria-hidden="true">↶</span> Hoàn tác</button>
        <button id="reset" type="button"><span aria-hidden="true">⟳</span> Chơi lại</button>
        <button id="hint" type="button"><span aria-hidden="true">✧</span> Gợi ý</button>
        <button id="advance" class="primary" type="button" hidden></button>
      </div>
    </section>
    <footer><span id="record"></span><span>SELFLO <b>·</b> THẾ GIỚI ÁNH SÁNG</span></footer>
  </main>
  <dialog id="menu" aria-labelledby="menu-title">
    <header><h2 id="menu-title"></h2><form method="dialog"><button aria-label="Đóng" type="submit">×</button></form></header>
    <div id="menu-content"></div>
  </dialog>
  <noscript>Hãy bật JavaScript để chơi Light Quest.</noscript>
</body>
</html>
